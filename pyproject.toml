[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "face-profile-system"
version = "0.1.0"
description = "Headless-first local identity and device-personalization service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Vaibhav Bisht" }]
dependencies = [
  "cryptography==46.0.3",
  "numpy==2.4.6",
  "opencv-python-headless==5.0.0.93",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.scripts]
face-profile = "face_profile.cli:main"

[dependency-groups]
dev = [
  "build==1.5.0",
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.0.3",
  "ruff==0.16.0",
  "types-PyYAML==6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/face_profile"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["face_profile"]

[tool.coverage.run]
branch = true
source = ["face_profile"]
