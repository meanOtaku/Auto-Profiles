# Explicit, tracked opt-in for the full recognize -> restore-settings path on
# a Jetson with a USB webcam: capture, integrity-pinned YuNet detection,
# in-memory tracking, quality/alignment, integrity-pinned SFace ONNX
# embeddings, an encrypted profile database, known-person recognition,
# safety-gated automatic candidate enrollment, active-user selection,
# last-used preference learning (load-and-apply on activation plus
# debounced save-back), the loopback-only REST/WebSocket API, the optional
# dashboard UI with its bounded-rate annotated webcam preview snapshot, and
# the real Linux settings backend (ALSA amixer volume, sysfs backlight
# brightness).
#
# This file is the described "full path"; it is not a small or casual
# opt-in. Read docs/RUNNING_ON_JETSON.md section 9 before using it -- it
# documents exactly which commands to run first (model provisioning,
# preflight) and what to expect once it is running (enroll/approve a
# profile, change volume/brightness, verify restoration on a later
# recognized session).
#
# What this file deliberately does NOT do:
#   - It does not expose the API beyond loopback (bind_host stays
#     127.0.0.1, auth_token stays null -- APIConfig's fail-closed validator
#     requires a real auth_token the moment bind_host leaves loopback; do
#     not edit this file to add LAN/WAN exposure, use your own private,
#     gitignored config instead, per docs/RUNNING_ON_UBUNTU.md section 7).
#   - It does not embed any credential, token, or secret (there are none in
#     this file at all).
#   - Automatic enrollment is an explicit high-risk operator choice. The
#     acknowledgement below asserts that the operator has authority/consent
#     to enroll people seen by this camera. Every candidate must still pass
#     multi-sample quality, consistency, duplicate, and liveness gates.
#   - Passive liveness is enabled because automatic promotion fails closed
#     without it. These classical spectral/reflectance heuristics have
#     genuinely unevaluated accuracy (docs/reports/M14.md): they can reject
#     legitimate users and are not proof of production-grade anti-spoofing.
#
# Before running this config, you MUST:
#   1. Run scripts/provision-models.sh to download and integrity-verify
#      both pinned models into models/ (fails closed on any hash
#      mismatch; never loads an unverified model).
#   2. Run scripts/preflight-jetson.sh --config config/jetson-full.yaml to
#      non-mutating-ly validate config, model files/hashes, the camera
#      device path/permissions, amixer capability, and backlight
#      availability/writability, WITHOUT changing volume or brightness.
#
# See docs/MODELS.md for exact model provenance/SHA-256 and
# docs/RUNNING_ON_JETSON.md section 9 for the full runbook.

camera:
  enabled: true
  source: webcam
  path: null
  device_index: 0
  retry_attempts: 2

detection:
  # Integrity-pinned YuNet: verified against docs/MODELS.md's recorded
  # SHA-256 before OpenCV ever loads the file.
  enabled: true
  backend: yunet
  model_path: models/face_detection_yunet_2023mar.onnx
  model_sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
  confidence_threshold: 0.5
  nms_threshold: 0.3
  top_k: 5000

tracking:
  enabled: true
  max_missing_frames: 5
  min_iou: 0.1
  max_center_distance: 2.0
  max_samples_per_track: 20
  max_tracks: 100

quality:
  # aligned_output_width/height (112x112) must match the embedding
  # model's required input size below -- both are SFace's documented
  # 112x112 aligned-crop contract (docs/MODELS.md).
  enabled: true
  min_face_width: 40.0
  min_face_height: 40.0
  min_sharpness_variance: 60.0
  min_mean_brightness: 40.0
  max_mean_brightness: 215.0
  max_overexposed_fraction: 0.15
  max_roll_degrees: 25.0
  max_yaw_asymmetry: 0.35
  max_landmark_margin_violation: 0.05
  aligned_output_width: 112
  aligned_output_height: 112
  best_sample_max_tracks: 100

embedding:
  # Integrity-pinned SFace (OpenCV Zoo, Apache-2.0): verified against
  # docs/MODELS.md's recorded SHA-256 before OpenCV ever loads the file.
  # input_mean: 0.0 / input_scale: 1.0 are NOT this adapter's old
  # ArcFace-style defaults -- they are SFace's actual, independently
  # confirmed preprocessing contract (cv::FaceRecognizerSF::feature uses
  # blobFromImage(img, 1, size, Scalar(0,0,0), swapRB=true), i.e. raw
  # unscaled pixels; see docs/MODELS.md). similarity_threshold: 0.363 is
  # OpenCV Zoo's own published SFace cosine-similarity threshold
  # (models/face_recognition_sface/sface.py's `_threshold_cosine`), not a
  # locally evaluated value -- no local same-person/different-person
  # dataset evaluation has been performed (M5 exit criteria remain open;
  # see docs/reports/M5.md and docs/reports/M16.md).
  enabled: true
  backend: onnx
  model_path: models/face_recognition_sface_2021dec.onnx
  model_sha256: 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79
  model_name: sface
  model_version: 2021dec
  dimension: 128
  input_width: 112
  input_height: 112
  input_mean: 0.0
  input_scale: 1.0
  similarity_threshold: 0.363
  similarity_margin: 0.05

database:
  enabled: true
  path: data/face_profile.sqlite3
  key_path: data/face_profile.key
  retention_days: 30
  maximum_embeddings_per_profile: 50

recognition:
  enabled: true
  min_consistent_observations: 3
  confirmation_window_seconds: 5.0
  max_tracks: 100
  embedding_cache_refresh_seconds: 2.0

enrollment:
  # High-risk explicit opt-in. This acknowledgement asserts operator
  # authority/consent; it is not consent collected from people on camera.
  # AppConfig also requires the camera-to-liveness pipeline, encrypted
  # database, recognition, enrollment, and a secure API configuration.
  enabled: true
  automatic_promotion: true
  automatic_promotion_consent_acknowledged: true
  minimum_samples: 5
  minimum_observation_seconds: 3.0
  minimum_quality: 0.65
  candidate_expiry_seconds: 30.0
  maximum_samples_per_candidate: 50
  default_name_prefix: Unknown
  minimum_internal_consistency: 0.5
  maximum_internal_similarity: 0.9999
  duplicate_profile_threshold: 0.5
  duplicate_candidate_threshold: 0.5
  near_frontal_max_roll_degrees: 12.0
  near_frontal_max_yaw_asymmetry: 0.15
  candidate_retention_days: 7

active_user:
  enabled: true
  face_size_weight: 0.3
  centre_weight: 0.2
  duration_weight: 0.2
  confidence_weight: 0.2
  priority_weight: 0.1
  duration_saturation_seconds: 5.0
  priority_normalization_scale: 100.0
  switch_margin: 0.1
  stability_duration_seconds: 2.0
  switch_cooldown_seconds: 5.0
  min_visible_duration_seconds: 0.5
  leaving_grace_seconds: 1.0

preference_learning:
  # Debounced save-back of stable real user changes. Loading and applying
  # the active profile's already-saved settings on activation is not a
  # separate opt-in -- it runs automatically whenever database + camera +
  # active_user are all enabled, as this file has them (see
  # settings/active_profile_applier.py and docs/reports/M16.md).
  enabled: true
  debounce_seconds: 3.0
  min_active_duration_seconds: 2.0
  self_application_tolerance_seconds: 2.0

api:
  # Loopback-only, no auth_token: safe because bind_host never leaves
  # 127.0.0.1 in this tracked file (APIConfig.validate_fail_closed).
  enabled: true
  bind_host: 127.0.0.1
  bind_port: 8443
  auth_token: null
  rate_limit_per_minute: 120
  max_request_body_bytes: 1000000
  events_page_size: 50
  worker_poll_interval_seconds: 0.1
  detection_interval_frames: 1

ui:
  enabled: true
  # The one tracked config where the annotated webcam preview is on: a
  # bounded-rate (~5 FPS), max-640px-wide, server-drawn JPEG snapshot with
  # boxes and privacy-safe labels (known -> display name + profile UUID;
  # unrecognized -> deterministic candidate name + candidate UUID once one
  # exists, else "Unknown"; liveness failures shown in a distinct color).
  # It is never a raw camera stream, never persisted beyond the single
  # latest in-memory frame, and never logged. See docs/THREAT_MODEL.md and
  # docs/reports/M13.md for the privacy/network-load trade-off this adds.
  webcam_preview_enabled: true
  webcam_preview_jpeg_quality: 70
  webcam_preview_max_fps: 5.0
  webcam_preview_max_width: 640

liveness:
  # Required safety gate for automatic promotion, but the passive heuristic
  # remains unevaluated and is not production-grade anti-spoofing.
  enabled: true
  minimum_passive_score: 0.5
  high_frequency_energy_min: 0.02
  high_frequency_energy_max: 0.35
  minimum_specular_variance: 5.0
  require_active_challenge: false
  active_challenge_min_yaw_delta: 0.2

logging:
  level: INFO

settings:
  # The real Linux adapter: ALSA amixer for volume, sysfs backlight for
  # brightness. On a headless Jetson with no display attached, brightness
  # capability commonly reports UNSUPPORTED (no /sys/class/backlight
  # device) -- this is expected, reported explicitly, and does not fail
  # the service (docs/reports/M9.md).
  backend: linux
  volume: 50
  brightness: 50
  min_apply_interval_seconds: 0.2
