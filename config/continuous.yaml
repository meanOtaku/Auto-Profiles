# Safe loopback-only continuous config for run-continuous.sh.
#
# This is identical to config/default.yaml except that api.enabled is true
# and bind_host stays on loopback (127.0.0.1), so `serve` can start with no
# auth_token required. Starting this config brings up the REST/WebSocket API
# daemon only. It does NOT enable camera capture, face detection, the
# profile database, recognition, enrollment, or any other sensitive
# capability -- those all remain disabled/mock, exactly as in
# config/default.yaml, until you opt in from your own private config (see
# docs/RUNBOOK.md and docs/RUNNING_ON_UBUNTU.md section 6). Do not add an
# auth_token or a non-loopback bind_host to this tracked file; use a
# gitignored private config instead (see docs/RUNNING_ON_UBUNTU.md section 5).

camera:
  # Hardware access remains off until an explicit frame source is configured.
  enabled: false
  source: mock
  path: null
  device_index: 0
  retry_attempts: 2

detection:
  # M2 remains mock-backed unless an integrity-pinned YuNet model is explicitly configured.
  enabled: false
  backend: mock
  model_path: null
  model_sha256: null
  confidence_threshold: 0.5
  nms_threshold: 0.3
  top_k: 5000

tracking:
  # M3 tracking is in-memory, geometric, and disabled until explicitly enabled.
  enabled: false
  max_missing_frames: 5
  min_iou: 0.1
  max_center_distance: 2.0
  max_samples_per_track: 20
  max_tracks: 100

quality:
  # M4 quality filtering and alignment are disabled until explicitly enabled.
  # Thresholds are conservative heuristic starting points; they must be
  # evaluated on local data before production use, per CODING_STANDARDS.md.
  enabled: false
  min_face_width: 40.0
  min_face_height: 40.0
  min_sharpness_variance: 60.0
  min_mean_brightness: 40.0
  max_mean_brightness: 215.0
  max_overexposed_fraction: 0.15
  max_roll_degrees: 25.0
  max_yaw_asymmetry: 0.35
  max_landmark_margin_violation: 0.05
  aligned_output_width: 112
  aligned_output_height: 112
  best_sample_max_tracks: 100

embedding:
  # M5 embedding generation is disabled and mock-backed until an
  # integrity-pinned, provenance-reviewed ONNX model is explicitly
  # configured. similarity_threshold/margin are unevaluated starting points;
  # see docs/reports/M5.md and ADR 0010 before relying on them.
  enabled: false
  backend: mock
  model_path: null
  model_sha256: null
  model_name: mock-content-hash
  model_version: "1"
  dimension: 128
  input_width: 112
  input_height: 112
  similarity_threshold: 0.5
  similarity_margin: 0.05

database:
  # M6 persistent, encrypted profile storage is disabled by default. The key
  # file must live outside version control and outside the database
  # directory's backup scope in production; see docs/adr/0011-persistent-
  # profile-database.md and docs/reports/M6.md before enabling.
  enabled: false
  path: data/face_profile.sqlite3
  key_path: data/face_profile.key
  retention_days: 30
  # M15 storage limit: bounds unconstrained per-profile embedding growth.
  # Matches enrollment.maximum_samples_per_candidate's default so a normal
  # promotion is never silently truncated.
  maximum_embeddings_per_profile: 50

recognition:
  # M7 known-person recognition is disabled by default. It additionally
  # requires embedding.enabled, since it consumes the M5 similarity
  # threshold/margin. Temporal-confirmation values are unevaluated starting
  # points; see docs/reports/M7.md before relying on them.
  enabled: false
  min_consistent_observations: 3
  confirmation_window_seconds: 5.0
  max_tracks: 100
  # M15: amortizes the active-profile embedding decrypt cost across this
  # interval instead of paying it on every recognize() call.
  embedding_cache_refresh_seconds: 2.0

enrollment:
  # M8 candidate enrollment is disabled by default. automatic_promotion
  # must stay false: HERMES.md requires liveness, consent, retention, and
  # API-security production gates before automatic promotion may run, and
  # none of those exist yet (liveness is M14; API security is M12). See
  # docs/reports/M8.md and ADR 0013.
  enabled: false
  automatic_promotion: false
  minimum_samples: 5
  minimum_observation_seconds: 3.0
  minimum_quality: 0.65
  candidate_expiry_seconds: 30.0
  maximum_samples_per_candidate: 50
  default_name_prefix: Unknown
  minimum_internal_consistency: 0.5
  maximum_internal_similarity: 0.9999
  duplicate_profile_threshold: 0.5
  duplicate_candidate_threshold: 0.5
  near_frontal_max_roll_degrees: 12.0
  near_frontal_max_yaw_asymmetry: 0.15
  candidate_retention_days: 7

active_user:
  # M10 active-user selection is disabled by default. Weights/margins are
  # unevaluated starting points from ARCHITECTURE.md §10's suggested score;
  # see docs/reports/M10.md before relying on them.
  enabled: false
  face_size_weight: 0.3
  centre_weight: 0.2
  duration_weight: 0.2
  confidence_weight: 0.2
  priority_weight: 0.1
  duration_saturation_seconds: 5.0
  priority_normalization_scale: 100.0
  switch_margin: 0.1
  stability_duration_seconds: 2.0
  switch_cooldown_seconds: 5.0
  min_visible_duration_seconds: 0.5
  leaving_grace_seconds: 1.0

preference_learning:
  # M11 last-used-preference learning is disabled by default. It requires
  # active_user.enabled (attribution) and a real, non-mock settings adapter
  # to observe anything meaningful; see docs/reports/M11.md and ADR 0016.
  enabled: false
  debounce_seconds: 3.0
  min_active_duration_seconds: 2.0
  self_application_tolerance_seconds: 2.0

api:
  # This is the one section that differs from config/default.yaml: the API
  # daemon is enabled so `serve` has something to start. It stays on
  # loopback with no auth_token, which config validation allows only
  # because bind_host is loopback (APIConfig.validate_fail_closed, ADR
  # 0017) -- non-loopback binding without an auth_token is rejected at
  # config-load time. Do not change bind_host in this tracked file; use a
  # private config for LAN/non-loopback exposure and set a real auth_token.
  enabled: true
  bind_host: 127.0.0.1
  bind_port: 8443
  auth_token: null
  rate_limit_per_minute: 120
  max_request_body_bytes: 1000000
  events_page_size: 50
  worker_poll_interval_seconds: 0.1
  # M15 adaptive detection frequency: 1 = detect every frame (default,
  # unchanged behavior). A value > 1 skips the detector on the other
  # frames and only advances tracks by motion prediction; raise
  # tracking.max_missing_frames accordingly or tracks may expire between
  # detections. See docs/reports/M15.md and ADR 0020.
  detection_interval_frames: 1

ui:
  # M13 optional dashboard is disabled by default; it is a pure API
  # client with no domain logic of its own. See docs/reports/M13.md.
  enabled: false

liveness:
  # M14 liveness is disabled by default. The passive checks are classical
  # spectral/reflectance heuristics, not a trained anti-spoof model, and
  # have no evaluated real-world accuracy; see docs/reports/M14.md and
  # ADR 0019 before enabling and relying on them.
  enabled: false
  minimum_passive_score: 0.5
  high_frequency_energy_min: 0.02
  high_frequency_energy_max: 0.35
  minimum_specular_variance: 5.0
  require_active_challenge: false
  active_challenge_min_yaw_delta: 0.2

logging:
  level: INFO

settings:
  # M9 keeps the in-memory mock adapter as the default; these values never
  # change host settings unless backend is explicitly set to "linux" (ALSA
  # amixer + sysfs backlight). See docs/reports/M9.md and ADR 0014 before
  # enabling the real adapter, and always verify the manual test first.
  backend: mock
  volume: 50
  brightness: 50
  min_apply_interval_seconds: 0.2
