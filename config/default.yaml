camera:
  # Hardware access remains off until an explicit frame source is configured.
  enabled: false
  source: mock
  path: null
  device_index: 0
  retry_attempts: 2

detection:
  # M2 remains mock-backed unless an integrity-pinned YuNet model is explicitly configured.
  enabled: false
  backend: mock
  model_path: null
  model_sha256: null
  confidence_threshold: 0.5
  nms_threshold: 0.3
  top_k: 5000

tracking:
  # M3 tracking is in-memory, geometric, and disabled until explicitly enabled.
  enabled: false
  max_missing_frames: 5
  min_iou: 0.1
  max_center_distance: 2.0
  max_samples_per_track: 20
  max_tracks: 100

quality:
  # M4 quality filtering and alignment are disabled until explicitly enabled.
  # Thresholds are conservative heuristic starting points; they must be
  # evaluated on local data before production use, per CODING_STANDARDS.md.
  enabled: false
  min_face_width: 40.0
  min_face_height: 40.0
  min_sharpness_variance: 60.0
  min_mean_brightness: 40.0
  max_mean_brightness: 215.0
  max_overexposed_fraction: 0.15
  max_roll_degrees: 25.0
  max_yaw_asymmetry: 0.35
  max_landmark_margin_violation: 0.05
  aligned_output_width: 112
  aligned_output_height: 112
  best_sample_max_tracks: 100

embedding:
  # M5 embedding generation is disabled and mock-backed until an
  # integrity-pinned, provenance-reviewed ONNX model is explicitly
  # configured. similarity_threshold/margin are unevaluated starting points;
  # see docs/reports/M5.md and ADR 0010 before relying on them.
  enabled: false
  backend: mock
  model_path: null
  model_sha256: null
  model_name: mock-content-hash
  model_version: "1"
  dimension: 128
  input_width: 112
  input_height: 112
  similarity_threshold: 0.5
  similarity_margin: 0.05

logging:
  level: INFO

settings:
  # M2 still uses the in-memory adapter; these values never change host settings.
  volume: 50
  brightness: 50
